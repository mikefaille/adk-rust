inputs:
  nixpkgs:
    # Floating on rolling: `devenv update` moves this with everything else,
    # no explicit rev bumps. Pin to ?rev= only to freeze a known-good rev.
    url: github:cachix/devenv-nixpkgs/rolling
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
