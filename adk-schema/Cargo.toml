[package]
name = "adk-schema"
version = "0.1.0"
edition = "2024"

[features]
default = []
schemars = ["dep:schemars"]
runtime-validation = ["dep:jsonschema"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
schemars = { version = "1", optional = true }
jsonschema = { version = "0.47", optional = true, default-features = false }
hex = "0.4.3"
